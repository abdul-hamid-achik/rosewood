name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build · Test · Lint
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The test suite uses swift-testing (`import Testing`), which needs Xcode 16+.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: brew install xcodegen swiftlint go-task

      - name: Generate Xcode project
        run: task gen

      - name: SwiftLint
        run: task lint

      - name: Build
        run: task build

      - name: Unit tests
        run: task test
