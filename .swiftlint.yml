# SwiftLint configuration for Rosewood.
# Goal: enforce real correctness/style on new code while not red-flagging the
# pre-existing large files that the ProjectViewModel decomposition is tracking.

included:
  - Sources
  - Tests

excluded:
  - .derived
  - .build
  - Rosewood.xcodeproj

# Size/complexity rules are set with generous thresholds so the existing
# monolith passes but new code can't grow it further.
disabled_rules:
  - non_optional_string_data_conversion
  - optional_data_string_conversion
  # SwiftUI Text supports `+` but not `+=`, so this fires as an unfixable false positive.
  - shorthand_operator

file_length:
  warning: 6000
  error: 8000

type_body_length:
  warning: 6000
  error: 8000

function_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 30
  error: 50

large_tuple:
  warning: 4
  error: 6

function_parameter_count:
  warning: 15
  error: 25

line_length:
  warning: 200
  error: 400
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 80
    error: 120
  # Leading-underscore backing storage is an intentional convention here.
  excluded:
    - _messages

force_try:
  severity: warning

nesting:
  type_level: 2
